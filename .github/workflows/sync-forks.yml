name: Sync forks from upstream

on:
  schedule:
    # Every six hours. Offset from the hour on purpose: runs queued exactly on
    # the hour sit behind the rest of GitHub's cron load and drift the most.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Restrict to these repos (space/comma separated). Blank = every fork.'
        required: false
        default: ''
      dry_run:
        description: 'Report what would change without writing'
        type: boolean
        default: false

# A long run must never overlap the next scheduled one.
concurrency:
  group: sync-forks
  cancel-in-progress: false

# The forks are written via FORK_SYNC_TOKEN, never via GITHUB_TOKEN. The only
# thing GITHUB_TOKEN writes is STATUS.md in this repo.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify token
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret FORK_SYNC_TOKEN is not set. See README.md."
            exit 1
          fi
          echo "authenticated as $(gh api user --jq .login)"

      - name: Sync forks
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          ORG: ${{ github.repository_owner }}
          ONLY: ${{ inputs.only }}
          EXCLUDE: ${{ vars.SYNC_EXCLUDE }}
          DRY_RUN: ${{ inputs.dry_run }}
          STATUS_FILE: STATUS.md
        run: ./scripts/sync-forks.sh

      # Keeps the repository active. A public repo's scheduled workflows are
      # disabled after 60 days without activity, and this job would otherwise
      # never commit anything. STATUS.md only changes when a fork actually
      # moves, so this is a record of upstream activity, not a heartbeat.
      - name: Record fork state
        if: ${{ inputs.dry_run != true }}
        run: |
          # --porcelain, not "git diff", so a not-yet-tracked STATUS.md counts.
          if [ -z "$(git status --porcelain -- STATUS.md)" ]; then
            echo "no fork moved; nothing to record"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "Record fork sync state"
          git push
